<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>박채원 사서 포트폴리오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 참고 이미지 스타일: 흰 바탕 · 검정 글씨 · 라임 형광 강조 · 테두리 박스 · 회색 패널 */
  :root {
    --paper: #f8fffb;          /* 배경 */
    --surface: #fbfffd;        /* 사이드바 · 모달 (배경보다 살짝 밝게) */
    --panel: #eeeeee;          /* 회색 면: 카드 안쪽 · 태그 · 제목 박스 · hover 배경 */
    --ink: #111111;
    --ink-2: #3d3d3d;
    --muted: #6b6b6b;
    --rule: #d9d9d9;
    --rule-strong: #8a8a8a;
    --frame: #8a8a8a;          /* 카드 바깥 얇은 테두리 */
    --accent: #a6f46a;         /* 라임 (배경용) */
    --accent-ink: #111111;     /* 라임 위 글자 */
    --accent-text: #2f7d12;    /* 흰 바탕 위 강조 글자 */
    --accent-soft: #a6f46a;
    --focus: #111111;
    --shine: rgba(255, 255, 255, .75);   /* skeleton 위를 지나가는 빛 */
    --marker: var(--accent);             /* 형광펜 */
    --c1: #111111; --c2: #a6f46a; --c3: #8a8a8a; --c4: #4f9e2b; --c5: #c7c7c7;
    --shadow: 3px 3px 0 var(--ink);
    --display: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --body: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #111111; --surface: #1a1a1a; --panel: #242424; --ink: #f2f2f2; --ink-2: #c4c4c4; --muted: #8f8f8f;
      --rule: #333333; --rule-strong: #5a5a5a; --frame: #5a5a5a; --accent-text: #a6f46a; --focus: #f2f2f2; --shine: rgba(255, 255, 255, .07); --marker: color-mix(in srgb, var(--accent) 40%, transparent);
      --c1: #f2f2f2; --c3: #7a7a7a; --c4: #6cc23f; --c5: #4a4a4a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #111111; --surface: #1a1a1a; --panel: #242424; --ink: #f2f2f2; --ink-2: #c4c4c4; --muted: #8f8f8f;
    --rule: #333333; --rule-strong: #5a5a5a; --frame: #5a5a5a; --accent-text: #a6f46a; --focus: #f2f2f2; --shine: rgba(255, 255, 255, .07); --marker: color-mix(in srgb, var(--accent) 40%, transparent);
    --c1: #f2f2f2; --c3: #7a7a7a; --c4: #6cc23f; --c5: #4a4a4a;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--body); font-size: 15px; line-height: 1.65;
    padding-right: 20px; padding-block: 0 64px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.02em; }
  p { margin: 0; }
  a { color: var(--accent-text); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

  .sample-note {
    margin-top: 16px; font-size: 12.5px; color: var(--ink-2);
    border: 1px dashed var(--rule-strong); border-radius: 6px; padding: 8px 12px;
  }
  .sample-note code { font-family: var(--mono); font-size: 12px; }

  /* ---------- 자기소개 ---------- */
  .intro {
    display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
    gap: 40px; padding-block: 8px 12px; align-items: start;
  }
  .intro h1 { font-size: clamp(34px, 5vw, 52px); font-weight: 800; line-height: 1.15; margin-top: 10px; }
  .intro h1 .en { display: block; font-family: var(--mono); font-size: 13px; font-weight: 400; color: var(--muted); letter-spacing: .04em; margin-top: 8px; }
  .lede { font-size: 17px; color: var(--ink-2); margin-top: 20px; max-width: 58ch; }
  .lede strong { color: var(--ink); font-weight: 700; background: linear-gradient(transparent 58%, color-mix(in srgb, var(--accent) 85%, transparent) 58%); padding: 0 2px; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 20px; }
  .tools span { font-size: 12.5px; font-weight: 500; padding: 3px 10px; background: var(--panel); border: 1px solid var(--frame); border-radius: 4px; color: var(--ink); }

  /* 열람카드 형태의 신상 카드 */
  .card-record {
    background-color: var(--panel); border: 1.5px solid var(--frame); border-radius: 10px;
    box-shadow: inset 0 0 0 6px var(--paper);
    padding: 22px 24px 16px; position: relative;
  }
  .card-record::after { /* 카드 하단 천공 */
    content: ""; position: absolute; left: 50%; bottom: 8px; width: 14px; height: 14px; margin-left: -7px;
    border-radius: 50%; border: 1px solid var(--rule-strong); background: var(--paper);
  }
  .card-record .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 10px; border-bottom: 1.5px solid var(--ink); margin-bottom: 4px; }
  .card-record .head .mono { font-size: 12px; color: var(--accent-ink); background: var(--accent); padding: 1px 8px; border-radius: 2px; }
  .card-record dl { margin: 0; display: grid; grid-template-columns: auto 1fr; column-gap: 16px; }
  .card-record dt, .card-record dd { line-height: 32px; margin: 0; font-size: 13.5px; }
  .card-record dt { color: var(--muted); font-size: 12.5px; }
  .card-record dd { color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
  .card-record .email-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .copy-btn { font: inherit; font-size: 11.5px; line-height: 1; padding: 5px 8px; border: 1px solid var(--rule-strong); border-radius: 4px; background: transparent; color: var(--ink-2); cursor: pointer; }
  .copy-btn:hover { border-color: #111; background: var(--accent); color: var(--accent-ink); }
  .card-record .spacer { height: 22px; }

  /* ---------- 요약 ---------- */
  section { padding-block: 28px; }
  /* 섹션 제목: 스크롤해도 위에 고정, 스크롤을 시작하면 아래에 그림자 */
  .sec-head {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; margin-bottom: 24px;
    position: sticky; top: 0; z-index: 10;
    margin-inline: -20px; padding: 14px 20px 0;
    /* 참고 이미지의 '결론' · '핵심 포인트': 검정 가로선 위에 얹힌 탭 */
    background: linear-gradient(var(--ink), var(--ink)) 20px 100% / calc(100% - 40px) 1.5px no-repeat, var(--paper);
    transition: box-shadow .2s ease;
  }
  .sec-head.is-stuck { box-shadow: 0 10px 14px -12px rgba(0,0,0,.25); }
  .sec-head h2 {
    font-size: 20px; font-weight: 800;
    padding: 5px 16px 9px; background: var(--panel);
    border: 1.5px solid var(--ink); border-bottom: 0; border-radius: 8px 8px 0 0;
    box-shadow: inset 0 -4px 0 var(--frame);
  }
  .sec-head p { color: var(--ink-2); font-size: 13px; padding-bottom: 8px; }

  /* ---------- 한눈에 보기: bento grid ---------- */
  .bento {
    display: grid; gap: 14px;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-template-areas:
      "proj proj evid  records"
      "proj proj hours hours"
      "dist dist dist  dist";
  }
  .tile {
    background: var(--panel); border: 1.5px solid var(--frame); border-radius: 10px;
    box-shadow: inset 0 0 0 6px var(--paper);
    padding: 22px 24px; min-width: 0;
    display: flex; flex-direction: column; gap: 4px;
  }
  .tile .label { align-self: flex-start; font-size: 12.5px; color: var(--accent-ink); background: var(--accent); font-weight: 700; padding: 1px 8px; border-radius: 2px; }
  .tile .value { font-family: var(--display); font-size: 34px; font-weight: 800; line-height: 1.2; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile .value small { font-family: var(--body); font-size: 14px; font-weight: 500; color: var(--ink-2); margin-left: 3px; }
  .tile .sub { font-size: 12.5px; color: var(--ink-2); }
  .tile .foot { margin-top: auto; padding-top: 14px; }
  /* 참고 이미지의 '결론' 박스: 테두리 안 라임 패널 */
  /* 한눈에 보기 카드: 누르면 메뉴로 이동 · hover 시 0.2초 동안 4px 떠오르고 그림자가 진해짐 */
  .tile[data-go] {
    cursor: pointer;
    box-shadow: inset 0 0 0 6px var(--paper), 0 2px 6px rgba(0, 0, 0, .06);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .stagger > .tile[data-go] { transition: opacity .6s ease calc(var(--i) * 100ms), transform .2s ease, box-shadow .2s ease; }
  .tile[data-go]:hover, .tile[data-go]:focus-visible {
    transform: translateY(-4px);
    box-shadow: inset 0 0 0 6px var(--paper), 0 12px 24px rgba(0, 0, 0, .2);
  }
  .t-proj { grid-area: proj; background: var(--accent); --ink: #111; --ink-2: #2a2a2a; color: #111; }
  .t-proj .label { background: #fff; color: #111; }
  .t-proj .value { font-size: clamp(56px, 7vw, 84px); line-height: 1; margin-top: 8px; color: #111; }
  .t-proj .value small { font-size: 18px; }
  .t-hours { grid-area: hours; }
  .t-records { grid-area: records; }
  .t-dist { grid-area: dist; }
  .t-evid { grid-area: evid; }

  /* 한눈에 보기 · 대표 프로젝트 · 프로젝트 · 자격증 · 경험 항목: 화면에 들어오면 0.1초 간격으로 차례로 fade in (JS가 .stagger를 붙였을 때만 숨김) */
  .stagger > * {
    opacity: 0;
    transition: opacity .6s ease;   /* fade in 0.6초 */
    transition-delay: calc(var(--i) * 100ms);
  }
  .stagger.is-in > * { opacity: 1; }
  /* ---------- Skeleton loading ---------- */
  .skel { position: relative; overflow: hidden; transition: opacity .25s ease; }
  .tile.skel, .cert-card.skel { background: var(--panel); border-style: solid; box-shadow: inset 0 0 0 6px var(--paper); }
  .tile.skel { min-height: 150px; }
  .sk-line { display: block; max-width: 100%; border-radius: 4px; background: color-mix(in srgb, var(--ink) 9%, var(--panel)); }
  /* 빛이 왼쪽에서 오른쪽으로 지나감 */
  .skel::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(100deg, transparent 30%, var(--shine) 50%, transparent 70%);
    transform: translateX(-100%); animation: shimmer 1.3s ease-in-out infinite;
  }
  @keyframes shimmer { to { transform: translateX(100%); } }
  .sk-out > .skel { opacity: 0; }
  /* 프로젝트 목록 skeleton 행 */
  .sk-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 4px; border-bottom: 1px solid var(--rule); }
  .sk-row .sk-line { background: var(--panel); }
  .sk-title { display: flex; gap: 8px; }
  .sk-year { padding: 16px 4px 4px; }
  /* 자기소개 카드 skeleton */
  .sk-card { margin: -4px -6px; padding: 4px 6px 30px; }
  .sk-card .sk-line { background: color-mix(in srgb, var(--ink) 9%, var(--panel)); }
  .sk-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1.5px solid color-mix(in srgb, var(--ink) 15%, var(--panel)); margin-bottom: 4px; }
  .sk-fact { display: grid; grid-template-columns: 56px 1fr; align-items: center; height: 32px; }
  .sk-arrived > * { animation: sk-arrive .6s ease both; }   /* 도착한 내용이 서서히 나타남 */
  @keyframes sk-arrive { from { opacity: 0; } }
  .sk-year .sk-line { background: var(--panel); }   /* 도착하면 회색 틀이 서서히 사라짐 */
  @media (prefers-reduced-motion: reduce) { .skel::after { animation: none; display: none; } }

  /* 카드 한 장 fade in (자기소개 카드) */
  .fade-one { opacity: 0; transition: opacity .6s ease; }
  .fade-one.is-in { opacity: 1; }

  /* 팀/개인 비율 */
  .split { display: flex; gap: 2px; height: 10px; border-radius: 999px; overflow: hidden; }
  .split i { display: block; height: 100%; }
  .split-legend { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; color: var(--ink-2); }
  .split-legend b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .proj-recent { margin-top: 14px; padding-top: 12px; border-top: 1.5px solid #111; font-size: 13px; color: var(--ink-2); }
  .proj-recent b { display: block; color: var(--ink); font-weight: 600; margin-top: 2px; }

  /* 증빙 링크 비율 */
  .meter { height: 6px; border-radius: 999px; background: var(--rule); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--ink); border-radius: inherit; }

  .dist-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  .dist-top .t { font-size: 12.5px; color: var(--accent-ink); background: var(--accent); font-weight: 700; padding: 1px 8px; border-radius: 2px; }
  .dist-top .s { font-size: 12px; color: var(--muted); }
  .bar { display: flex; gap: 2px; height: 14px; position: relative; }
  .bar .seg { height: 100%; border-radius: 0; cursor: pointer; border: 0; padding: 0; transition: opacity .15s; }
  .bar .seg:first-child { border-radius: 4px 0 0 4px; }
  .bar .seg:last-child { border-radius: 0 4px 4px 0; }
  .bar.has-hover .seg:not(:hover) { opacity: .45; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .legend b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tip {
    position: fixed; pointer-events: none; z-index: 30; background: var(--ink); color: var(--paper);
    font-size: 12.5px; padding: 6px 9px; border-radius: 4px; white-space: nowrap; box-shadow: var(--shadow);
  }

  /* ---------- 대표 프로젝트 ---------- */
  .featured { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .feat {
    text-align: left; font: inherit; color: inherit; cursor: pointer;
    background: var(--panel); border: 1.5px solid var(--frame); border-radius: 10px;
    box-shadow: inset 0 0 0 6px var(--paper);
    padding: 24px; display: flex; flex-direction: column; gap: 12px;
    transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  /* fade in과 hover 효과를 함께: 대기 시간(delay)은 opacity에만 */
  .featured.stagger > .feat { transition: opacity .6s ease calc(var(--i) * 100ms), border-color .15s, box-shadow .15s, transform .15s; }
  .feat:hover { border-color: var(--ink); box-shadow: inset 0 0 0 6px var(--paper), 4px 4px 0 var(--ink); transform: translate(-3px, -3px); }
  .feat .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .feat .call { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .feat h3 { font-size: 19px; font-weight: 800; line-height: 1.35; }
  .feat .sum { color: var(--ink-2); font-size: 14px; }
  .feat .kpi { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--rule); display: flex; align-items: baseline; gap: 10px; }
  .feat .kpi .v { font-family: var(--display); font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .feat .kpi .l { font-size: 13px; color: var(--ink-2); }
  .feat .more { font-size: 13px; color: var(--accent-text); font-weight: 500; }

  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

  /* ---------- 역량별 목록 ---------- */
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .filters button {
    font: inherit; font-size: 13px; cursor: pointer; padding: 6px 12px; border-radius: 999px;
    border: 1.5px solid var(--frame); background: var(--paper); color: var(--ink-2);
    display: inline-flex; align-items: center; gap: 7px;
  }
  .filters button i { width: 8px; height: 8px; border-radius: 50%; }
  .filters button .n { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .filters button[aria-pressed="true"] { background: var(--accent); border-color: #111; color: var(--accent-ink); font-weight: 700; box-shadow: 2px 2px 0 #111; }
  .filters button[aria-pressed="true"] .n { color: var(--accent-ink); opacity: .7; }

  .comp-desc { font-size: 13.5px; color: var(--ink-2); margin-bottom: 12px; min-height: 1.6em; }
  .list { border-top: 1.5px solid var(--ink); }
  .row {
    width: 100%; text-align: left; font: inherit; color: inherit; background: transparent; cursor: pointer;
    border: 0; border-bottom: 1px solid var(--rule);
    display: grid; grid-template-columns: 116px minmax(0, 1fr) 150px 120px 24px; gap: 16px; align-items: center;
    padding: 14px 8px;
  }
  .row:hover { background: var(--panel); }
  .row .call { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
  .row .title { font-weight: 600; font-size: 15px; }
  .row .title .star { font-size: 11px; font-weight: 700; color: var(--accent-ink); background: var(--accent); padding: 1px 6px; border-radius: 3px; margin-left: 6px; vertical-align: 2px; }
  .row .role { font-size: 13px; color: var(--ink-2); display: block; margin-top: 2px; }
  .row .period { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); }
  .row .arrow { color: var(--muted); font-size: 18px; }
  .row:hover .arrow { color: var(--accent-text); }

  /* ---------- 상세 다이얼로그 ---------- */
  dialog {
    border: 0; padding: 0; background: var(--surface); color: var(--ink);
    width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
    border: 1.5px solid var(--ink); border-radius: 10px; box-shadow: 6px 6px 0 var(--ink);
  }
  dialog::backdrop { background: rgba(14,18,26,.55); }
  .dlg { display: flex; flex-direction: column; max-height: calc(100vh - 48px); }
  .dlg-head { padding: 22px 24px 0; border-bottom: 1.5px solid var(--ink); }
  .dlg-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .dlg-meta .mono { font-size: 12.5px; color: var(--accent-ink); background: var(--accent); padding: 1px 8px; border-radius: 2px; }
  .close { font: inherit; font-size: 13px; background: transparent; border: 1px solid var(--rule-strong); color: var(--ink-2); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  .close:hover { color: var(--ink); border-color: var(--ink-2); }
  .dlg-head h3 { font-size: 24px; font-weight: 800; margin-top: 10px; line-height: 1.3; }
  .facts { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
  .facts .k { color: var(--muted); margin-right: 5px; }
  .tabs { display: flex; gap: 2px; margin-top: 16px; overflow-x: auto; }
  .tabs button {
    font: inherit; font-size: 14px; font-weight: 500; background: transparent; border: 0; cursor: pointer;
    padding: 10px 14px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
  }
  .tabs button[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom: 4px solid var(--accent); }
  .tabs button .n { font-family: var(--mono); font-size: 11.5px; margin-left: 4px; color: var(--muted); }
  .dlg-body { padding: 22px 24px 26px; overflow-y: auto; }
  .panel h4 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 8px; letter-spacing: .02em; }
  .panel > * + h4 { margin-top: 22px; }
  .panel p { color: var(--ink-2); max-width: 64ch; }

  /* 자격증 카드: 참고 이미지의 '포인트' 카드처럼 얇은 테두리 + 흰 여백 + 회색 패널 */
  .cert-cards {

const col = (k) => `var(${C[k].color})`;

/* 요약 카드 — classProjects · experiences · certifications에서 계산 */
function renderStats() {
  const CPs = PORTFOLIO.classProjects || [], EXs = PORTFOLIO.experiences || [], CTs = PORTFOLIO.certifications || [];
  const kindOf = (c) => (c.course ? "course" : "intern");
  const KIND = { course: { label: "수업 프로젝트", color: "var(--c1)", go: "project" },
                 intern: { label: "실무실습", color: "var(--c2)", go: "project" },
                 award:  { label: "수상", color: "var(--c4)", go: "credentials" } };
  const nCourse = CPs.filter((c) => kindOf(c) === "course").length, nIntern = CPs.length - nCourse;
  const awards = EXs.filter((e) => e.type === "award");
  const days = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5) + 1;
  // 같은 실무실습(program)에서 나온 항목은 기간·기관 계산과 타임라인에서 하나로 묶음
  const interns = CPs.filter((c, i) => kindOf(c) === "intern" && (!c.program || CPs.findIndex((x) => x.program === c.program) === i));
  const internDays = interns.reduce((t, c) => t + days(c.start, c.end), 0);
  const certs = CTs.filter((c) => c.status === "취득");
  const recent = CPs.reduce((a, c) => (!a || ym(c.end) > ym(a.end) ? c : a), null);
  // 타임라인: 프로젝트 + 수상
  const items = CPs.filter((c) => kindOf(c) === "course").concat(interns).map((c) => ({ k: kindOf(c), title: c.program || c.title, start: c.start, end: c.end }))
    .concat(awards.map((e) => ({ k: "award", title: e.title, start: e.start, end: e.end })));
  if (!items.length) return;
  const val = (v, u) => `<div class="value">${v}<small>${u}</small></div>`;

  $("stats").innerHTML = `
    <div class="tile t-proj">
      <div class="label">수행 프로젝트</div>
      ${val(fmt(CPs.length), "건")}
      <div class="foot">
        <div class="split" role="img" aria-label="수업 ${nCourse}건, 실무실습 ${nIntern}건">
          <i style="flex:${nCourse};background:#111"></i><i style="flex:${nIntern};background:rgba(17,17,17,.35)"></i>
        </div>
        <div class="split-legend"><span>수업 <b>${nCourse}</b></span><span>실무실습 <b>${nIntern}</b></span></div>
        ${recent ? `<div class="proj-recent">가장 최근 프로젝트<b>${esc(recent.title)}</b></div>` : ""}
      </div>
    </div>
    <div class="tile t-evid">
      <div class="label">수상</div>
      ${val(fmt(awards.length), "건")}
      <div class="sub">${awards.map((e) => esc(e.title)).join(", ")}</div>
    </div>
    <div class="tile t-records">
      <div class="label">보유 자격증</div>
      ${val(fmt(certs.length), "개")}
      <div class="sub">${certs.map((c) => esc(c.name)).join(" · ")}</div>
    </div>
    <div class="tile t-hours">
      <div class="label">실무실습 기간</div>
      ${val(fmt(internDays), "일")}
      <div class="sub">기관 ${interns.length}곳 · 달력 기준</div>
    </div>
    <div class="tile t-dist">
      <div class="dist-top">
        <span class="t">활동 구성</span>
        <span class="s">막대를 누르면 해당 메뉴로 이동</span>
      </div>
      <div class="bar" id="distBar" role="group" aria-label="유형별 활동 수"></div>
      <div class="legend" id="distLegend"></div>
    </div>`;

  // 유형별 막대
  const total = items.length;
  const counts = Object.keys(KIND).map((k) => ({ k, n: items.filter((i) => i.k === k).length })).filter((d) => d.n > 0);
  const bar = $("distBar"), tip = $("tip");
  bar.innerHTML = counts.map((d) => `<button class="seg" type="button" data-k="${d.k}" style="flex:${d.n};background:${KIND[d.k].color}" aria-label="${KIND[d.k].label} ${d.n}건"></button>`).join("");
  $("distLegend").innerHTML = counts.map((d) => `<span><i style="background:${KIND[d.k].color}"></i>${KIND[d.k].label} <b>${d.n}</b></span>`).join("");
  bar.querySelectorAll(".seg").forEach((seg) => {
    const k = seg.dataset.k, n = counts.find((d) => d.k === k).n;
    seg.addEventListener("mouseenter", () => { bar.classList.add("has-hover"); tip.textContent = `${KIND[k].label} · ${n}건 (${Math.round((n / total) * 100)}%)`; tip.hidden = false; });
    seg.addEventListener("mousemove", (e) => { tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = e.clientY - 36 + "px"; });
    seg.addEventListener("mouseleave", () => { bar.classList.remove("has-hover"); tip.hidden = true; });
    seg.addEventListener("click", () => goTo(KIND[k].go));
  });

  // 카드를 누르면 관련 내용이 있는 메뉴로 이동 (활동 구성의 막대는 막대별 메뉴로)
  const GO = { "t-proj": "project", "t-hours": "experience", "t-records": "credentials",
               "t-dist": "project", "t-evid": "experience" };
  const MENU = { project: "프로젝트", credentials: "자격 · 경험", experience: "경험" };
  $("stats").querySelectorAll(".tile").forEach((t) => {
    const go = GO[Object.keys(GO).find((c) => t.classList.contains(c))];
    if (!go) return;
    t.dataset.go = go;
    t.tabIndex = 0;
    t.setAttribute("role", "link");
    t.title = `${MENU[go]} 메뉴로 이동`;

/* 메뉴로 이동: 메뉴별 보기 상태면 해시로 그 메뉴를 열고, 전체 보기면 부드럽게 스크롤.
   id가 섹션 안의 일부(예: experience)면 그 섹션을 연 뒤 해당 위치로 스크롤 */
function goTo(id) {
  const el = $(id);
  const sec = el.closest("[data-view-id]").id;
  if (!currentView) { el.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (currentView === sec) { if (el.id !== sec) el.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (el.id !== sec) addEventListener("hashchange", () => requestAnimationFrame(() => el.scrollIntoView({ block: "start" })), { once: true });
  location.hash = sec;
}

  const t = e.target.closest(".tile[data-go]");

});

/* 카드 stagger fade in: 목록이 화면에 처음 들어올 때 한 번 재생.
   이미 재생된 목록을 다시 그린 뒤 호출하면(경험 필터 등) 새 항목으로 다시 재생 */
function stagger(list) {
  const items = list.children;
  if (!items.length || !("IntersectionObserver" in window)) return;
  [...items].forEach((t, i) => t.style.setProperty("--i", i));
  if (list.classList.contains("is-in")) {
    list.classList.remove("is-in");
    void list.offsetWidth;            // 투명한 상태를 한 번 그린 뒤 다시 fade in
    list.classList.add("is-in");
    return;
  }
  if (list.classList.contains("stagger")) return;   // 아직 화면에 들어오기 전: 관찰 중
  list.classList.add("stagger");
  revealOnce(list);
}
/* 요소가 화면에 처음 들어오면 .is-in을 붙임 */
function revealOnce(el) {
  const io = new IntersectionObserver((entries) => {
    if (!entries.some((e) => e.isIntersecting)) return;
    el.classList.add("is-in");
    io.disconnect();
  }, { threshold: 0.15 });
  io.observe(el);
}
/* 카드 한 장 fade in */
function fadeIn(el) {
  if (!el || !("IntersectionObserver" in window)) return;
  el.classList.add("fade-one");
  revealOnce(el);
}

/* ---------- Skeleton loading: 목록을 불러오는 동안 카드 모양 회색 틀 + 빛이 지나가는 효과 ----------
   지금은 데이터가 이 파일 안에 있어 바로 준비되므로 LOAD_MS만큼 불러오는 시간을 흉내 냅니다.
   나중에 서버에서 받아 오게 되면 fakeLoad()를 fetch(...)로 바꾸면 됩니다. */
const LOAD_MS = 900;
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const fakeLoad = () => wait(LOAD_MS);
const sk = (w, h, extra = "") => `<i class="sk-line" style="width:${w};height:${h}px${extra}"></i>`;
function withSkeleton(list, skeletonHTML, render) {
  list.innerHTML = skeletonHTML;
  list.setAttribute("aria-busy", "true");
  return fakeLoad()
    .then(() => { list.classList.add("sk-out"); return wait(250); })   // 회색 틀이 서서히 사라지고
    .then(() => {
      list.classList.remove("sk-out");
      render();                                                     // 실제 카드가
      list.removeAttribute("aria-busy");
      stagger(list);                                                // 0.1초 간격으로 서서히 나타남
    });
}

/* 드롭다운(정렬 · 분야): 버튼을 누르면 위에서 아래로 펼쳐지고, 항목을 고르거나 바깥을 누르면(또는 Esc) 닫힘
   id → #id, #idBtn, #idList, #idLabel, (#idCount). opts: [key, 이름, 개수?] */
function dropdown(id, opts, get, set) {
  const dd = $(id), btn = $(id + "Btn"), list = $(id + "List"), count = $(id + "Count");
  list.innerHTML = opts.map(([k, l, n]) => `<li class="dd-opt" role="option" tabindex="-1" data-f="${esc(k)}">${esc(l)}${n != null ? `<span class="n">${n}</span>` : ""}</li>`).join("");
  const items = [...list.children];
  const sync = () => {
    const o = opts.find(([k]) => k === get());
    $(id + "Label").textContent = o[1];
    if (count) count.textContent = o[2] ?? "";
    items.forEach((li) => li.setAttribute("aria-selected", li.dataset.f === get()));
  };
  const open = () => {
    dd.classList.add("is-open"); btn.setAttribute("aria-expanded", "true");
    (items.find((li) => li.dataset.f === get()) || items[0]).focus({ preventScroll: true });
  };
  const close = (focusBtn) => {
    if (!dd.classList.contains("is-open")) return;
    dd.classList.remove("is-open"); btn.setAttribute("aria-expanded", "false");
    if (focusBtn) btn.focus();
  };
  const pick = (li) => {
    if (li.dataset.f !== get()) { set(li.dataset.f); sync(); renderCP(); }
    close(true);
  };
  sync();
  btn.addEventListener("click", () => (dd.classList.contains("is-open") ? close(false) : open()));
  btn.addEventListener("keydown", (e) => { if (e.key === "ArrowDown") { e.preventDefault(); open(); } });
  list.addEventListener("click", (e) => { const li = e.target.closest(".dd-opt"); if (li) pick(li); });
  list.addEventListener("keydown", (e) => {
    const i = items.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { e.preventDefault(); items[Math.min(i + 1, items.length - 1)].focus(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); items[Math.max(i - 1, 0)].focus(); }
    else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (i >= 0) pick(items[i]); }
    else if (e.key === "Escape") { e.preventDefault(); close(true); }
    else if (e.key === "Tab") close(false);
  });
  // 바깥을 누르면 닫힘 (다른 드롭다운을 눌러도 닫힘)
  document.addEventListener("click", (e) => { if (!dd.contains(e.target)) close(false); });
}

    ${c.number ? `<p class="cc-num"><span class="mono">${esc(c.number)}</span><button class="copy-btn" type="button" data-copy="${esc(c.number)}">복사</button></p>` : ""}
    ${c.file ? `<p class="cc-note mono">${esc(c.file)}</p>` : ""}
    ${c.verifyHow || c.verifyUrl ? `<div class="cc-foot">
      ${c.verifyHow ? `<span>${esc(c.verifyHow)}</span>` : ""}
      ${linkAct(c.verifyUrl, "진위 확인")}
    </div>` : ""}
  </li>`).join("");
const certSkeleton = CERTS.map(() => `
  <li class="cert-card skel" aria-hidden="true">
    <div class="cc-top">${sk("52px", 20)}${sk("70px", 12)}</div>
    ${sk("70%", 18)}${sk("50%", 12, ";margin-top:6px")}
    <div class="cc-foot">${sk("80%", 10)}${sk("84px", 30)}</div>
  </li>`).join("");
withSkeleton($("certList"), certSkeleton, renderCerts);

let expType = "all";
function renderExp({ list = true } = {}) {   // list: false → 필터 버튼만 그림 (목록은 skeleton 상태 유지)
  const types = Object.keys(ET).filter((k) => EXPS.some((e) => e.type === k));
  $("expFilters").innerHTML = [["all", "전체", EXPS.length]].concat(types.map((k) => [k, ET[k], EXPS.filter((e) => e.type === k).length]))
    .map(([k, l, n]) => `<button type="button" data-et="${k}" aria-pressed="${k === expType}">${l}<span class="n">${n}</span></button>`).join("");
  $("expFilters").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { expType = b.dataset.et; renderExp(); }));
  if (!list) return;
  const rows = EXPS.filter((e) => expType === "all" || e.type === expType).sort((a, b) => ym(b.end) - ym(a.end));
  let lastYear = null, h = "";
  rows.forEach((e) => {
    const y = e.end.slice(0, 4);
    if (y !== lastYear) { h += `<div class="year">${y}</div>`; lastYear = y; }
    const period = e.start === e.end ? dot(e.start) : `${dot(e.start)}–${dot(e.end)}`;
    h += `
    <details class="item">
      <summary>
        <span class="it-name">${esc(e.title)}<span class="it-sub">${esc(ET[e.type] || "")} · ${esc(e.org)}</span></span>
        <span class="it-date">${period}</span><span class="chev" aria-hidden="true">›</span>
      </summary>
      <dl class="verify">
        ${e.desc ? `<dt>내용</dt><dd>${esc(e.desc)}</dd>` : ""}
        ${e.phases ? e.phases.map((ph) => `<dt>${esc(ph.label)}</dt><dd>${ph.start === ph.end ? dot(ph.start) : `${dot(ph.start)}–${dot(ph.end)}`}</dd>`).join("") : `<dt>기간</dt><dd>${period}${e.hours ? ` · ${fmt(e.hours)}시간` : ""}</dd>`}
        ${e.proof ? `<dt>증빙</dt><dd>${esc(e.proof)}${e.file ? ` <span class="mono" style="font-size:12px;color:var(--muted)">(${esc(e.file)})</span>` : ""}</dd>` : ""}
        ${e.contact ? `<dt>확인처</dt><dd>${esc(e.contact)}</dd>` : ""}
        ${(e.verifyUrl || e.project) ? `<div class="actions">${linkAct(e.verifyUrl, "실적 조회 사이트")}${projAct(e.project)}</div>` : ""}
      </dl>
    </details>`;
  });
  $("expList").innerHTML = h;
  stagger($("expList"));
}
/* 경험 목록 skeleton: 연도 줄 + 실제 행과 같은 높이의 회색 줄 (제목 / 유형 · 기관 / 기간). 필터 버튼은 바로 보임 */
renderExp({ list: false });
{
  let lastYear = null, h = "";
  EXPS.slice().sort((a, b) => ym(b.end) - ym(a.end)).forEach((e) => {
    const y = e.end.slice(0, 4);
    if (y !== lastYear) { h += `<div class="sk-year skel" aria-hidden="true">${sk("36px", 12)}</div>`; lastYear = y; }
    h += `
    <div class="sk-row skel" aria-hidden="true">
      <span class="sk-main">${sk(`${30 + (e.title.length % 4) * 6}%`, 18)}${sk("24%", 12, ";margin-top:8px")}</span>
      ${sk("140px", 12)}
    </div>`;
  });
  withSkeleton($("expList"), h, renderExp);
}

const got = CERTS.filter((c) => c.status === "취득").length;
const expHours = EXPS.reduce((a, e) => a + (e.hours || 0), 0);
$("credCount").textContent = `자격 ${CERTS.length}개 (취득 ${got} · 예정 ${CERTS.length - got}) · 경험 ${EXPS.length}건${expHours ? ` · 확인된 활동 ${fmt(expHours)}시간` : ""}`;

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-copy]");
  if (!b) return;
  const done = () => { b.textContent = "복사됨"; setTimeout(() => (b.textContent = "복사"), 1500); };
  try { navigator.clipboard.writeText(b.dataset.copy).then(done, () => (b.textContent = "직접 선택해 복사")); } catch (err) { b.textContent = "직접 선택해 복사"; }
});

/* 프로젝트 · 자격 · 경험 항목: 누르면 0.3초 동안 펼쳐지고 접힘 (경험 목록은 다시 그려지므로 위임) */
const EXPAND_MS = 300;
document.addEventListener("click", (e) => {
  const summary = e.target.closest("details.item > summary");
  if (!summary) return;
  const d = summary.parentElement;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;   // 기본 동작으로 즉시 토글
  e.preventDefault();
  const from = d.offsetHeight;
  if (d._anim) d._anim.cancel();
  const closing = d.open && !d.classList.contains("is-closing");
  let to;
  if (closing) {
    d.classList.add("is-closing");
    to = summary.offsetHeight + 1;           // border-bottom 1px 포함
  } else {
    d.classList.remove("is-closing");
    d.open = true;
    to = d.offsetHeight;
  }
  d.style.overflow = "hidden";
  d._anim = d.animate({ height: [from + "px", to + "px"] }, { duration: EXPAND_MS, easing: "ease" });
  d._anim.onfinish = () => {
    if (closing) { d.open = false; d.classList.remove("is-closing"); }
    d.style.height = d.style.overflow = "";
    d._anim = null;
  };
});

/* projects가 비어 있으면 대표·역량별 프로젝트 섹션과 메뉴를 숨김 */
if (!P.length) ["featured-projects", "projects"].forEach((id) => {
  $(id).remove();
  const a = document.querySelector(`.sidebar nav a[href="#${id}"]`);
  if (a) a.remove();
});

/* 메뉴 하나만 보기: #about, #summary … 해시면 그 섹션만 표시, #all이면 전체 */
function applyView() {
  const id = location.hash.slice(1);
  if (/^p\d+$/.test(id)) return;            // 프로젝트 다이얼로그용 해시는 보기 상태를 바꾸지 않음
  const target = id && id !== "all" ? document.querySelector(`[data-view-id]#${CSS.escape(id)}`) : null;
  currentView = target ? id : null;
  if (currentView) document.body.dataset.view = currentView;
  else delete document.body.dataset.view;
  document.querySelectorAll("[data-view-id]").forEach((el) => el.classList.toggle("is-active", el === target));
  document.querySelectorAll(".sidebar nav a").forEach((a) => {
    const on = a.getAttribute("href") === "#" + (currentView || "all");
    if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  scrollTo(0, 0);
}
addEventListener("hashchange", applyView);

/* 고정된 섹션 제목에 그림자: 스크롤을 시작했고 제목이 맨 위에 붙어 있을 때 */
function updateStuck() {
  const scrolled = scrollY > 0;
  document.querySelectorAll(".sec-head").forEach((h) => {
    h.classList.toggle("is-stuck", scrolled && h.getBoundingClientRect().top <= 0.5 && h.parentElement.getBoundingClientRect().top < 0);
  });
}
addEventListener("scroll", updateStuck, { passive: true });
addEventListener("resize", updateStuck);
addEventListener("hashchange", () => requestAnimationFrame(updateStuck));
updateStuck();

/* 사이드바 접기/펼치기 — 넓은 화면은 상태를 기억, 좁은 화면은 접힌 채로 시작 */
const sbToggle = $("sbToggle"), sbTip = $("sbTip");
const narrow = matchMedia("(max-width: 860px)");
function setSidebar(collapsed, save) {
  document.body.classList.toggle("sb-collapsed", collapsed);
  sbToggle.setAttribute("aria-expanded", String(!collapsed));
  sbToggle.setAttribute("aria-label", collapsed ? "메뉴 펼치기" : "메뉴 접기");
  if (save && !narrow.matches) { try { localStorage.setItem("pf-sidebar", collapsed ? "1" : "0"); } catch (e) {} }
}
let sbSaved = null;
try { sbSaved = localStorage.getItem("pf-sidebar"); } catch (e) {}
setSidebar(narrow.matches || sbSaved === "1", false);
requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add("sb-ready")));
sbToggle.addEventListener("click", () => setSidebar(!document.body.classList.contains("sb-collapsed"), true));
$("sbScrim").addEventListener("click", () => setSidebar(true, false));
narrow.addEventListener("change", (e) => setSidebar(e.matches || sbSaved === "1", false));
// 좁은 화면에서 메뉴를 고르면 다시 접기
document.querySelectorAll(".sidebar .sb-link").forEach((a) => a.addEventListener("click", () => { if (narrow.matches) setSidebar(true, false); }));
// 접힌 상태에서 아이콘에 올리면 메뉴 이름 표시
document.querySelectorAll(".sidebar .sb-link").forEach((a) => {
  const show = () => {
    if (!document.body.classList.contains("sb-collapsed")) return;
    const r = a.getBoundingClientRect();
    sbTip.textContent = a.dataset.label; sbTip.hidden = false;
    sbTip.style.left = r.right + 10 + "px"; sbTip.style.top = r.top + r.height / 2 - sbTip.offsetHeight / 2 + "px";
  };
  const hide = () => { sbTip.hidden = true; };
  a.addEventListener("mouseenter", show); a.addEventListener("focus", show);
  a.addEventListener("mouseleave", hide); a.addEventListener("blur", hide);
});
applyView();

if (P.length) $("foot").textContent = `요약 수치는 프로젝트 ${P.length}건의 기록(투입 시간·레코드 수·기간·증빙)을 페이지가 열릴 때 직접 합산한 값입니다. 마지막 갱신 2026.11.`;
</script>
