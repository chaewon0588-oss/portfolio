<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>박채원 사서 포트폴리오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --paper: #f4f5f8;
    --surface: #ffffff;
    --ink: #18202b;
    --ink-2: #4a5363;
    --muted: #6f7787;
    --rule: #dce0e7;
    --rule-strong: #c3c9d4;
    --accent: #5b3e9e;
    --accent-soft: #ece8f6;
    --focus: #5b3e9e;
    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4;
    --shadow: 0 1px 2px rgba(24,32,43,.06), 0 8px 24px rgba(24,32,43,.08);
    --display: "Hahmlet", "Noto Serif KR", "Batang", serif;
    --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #12151b; --surface: #1a1e26; --ink: #eef0f4; --ink-2: #b7bdc9; --muted: #8b93a2;
      --rule: #2c323d; --rule-strong: #3d4450; --accent: #a796e6; --accent-soft: #29243e; --focus: #a796e6;
      --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #12151b; --surface: #1a1e26; --ink: #eef0f4; --ink-2: #b7bdc9; --muted: #8b93a2;
    --rule: #2c323d; --rule-strong: #3d4450; --accent: #a796e6; --accent-soft: #29243e; --focus: #a796e6;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--body); font-size: 15px; line-height: 1.65;
    padding-right: 20px; padding-block: 0 64px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
  p { margin: 0; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

  .sample-note {
    margin-top: 16px; font-size: 12.5px; color: var(--ink-2);
    border: 1px dashed var(--rule-strong); border-radius: 6px; padding: 8px 12px;
  }
  .sample-note code { font-family: var(--mono); font-size: 12px; }

  /* ---------- 자기소개 ---------- */
  .intro {
    display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
    gap: 40px; padding-block: 8px 12px; align-items: start;
  }
  .intro h1 { font-size: clamp(34px, 5vw, 52px); font-weight: 700; line-height: 1.15; margin-top: 10px; }
  .intro h1 .en { display: block; font-family: var(--mono); font-size: 13px; font-weight: 400; color: var(--muted); letter-spacing: .04em; margin-top: 8px; }
  .lede { font-size: 17px; color: var(--ink-2); margin-top: 20px; max-width: 58ch; }
  .lede strong { color: var(--ink); font-weight: 600; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 20px; }
  .tools span { font-size: 12.5px; padding: 3px 9px; border: 1px solid var(--rule-strong); border-radius: 999px; color: var(--ink-2); }

  /* 열람카드 형태의 신상 카드 */
  .card-record {
    background: var(--surface); border: 1px solid var(--rule-strong); border-radius: 4px;
    padding: 18px 20px 14px; position: relative;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--rule) 31px, var(--rule) 32px);
    background-position: 0 50px;
  }
  .card-record::after { /* 카드 하단 천공 */
    content: ""; position: absolute; left: 50%; bottom: 8px; width: 14px; height: 14px; margin-left: -7px;
    border-radius: 50%; border: 1px solid var(--rule-strong); background: var(--paper);
  }
  .card-record .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--rule-strong); margin-bottom: 4px; }
  .card-record .head .mono { font-size: 12px; color: var(--accent); }
  .card-record dl { margin: 0; display: grid; grid-template-columns: auto 1fr; column-gap: 16px; }
  .card-record dt, .card-record dd { line-height: 32px; margin: 0; font-size: 13.5px; }
  .card-record dt { color: var(--muted); font-size: 12.5px; }
  .card-record dd { color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
  .card-record .email-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .copy-btn { font: inherit; font-size: 11.5px; line-height: 1; padding: 5px 8px; border: 1px solid var(--rule-strong); border-radius: 4px; background: transparent; color: var(--ink-2); cursor: pointer; }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .card-record .spacer { height: 22px; }

  /* ---------- 요약 ---------- */
  section { padding-block: 28px; }
  /* 섹션 제목: 스크롤해도 위에 고정, 스크롤을 시작하면 아래에 그림자 */
  .sec-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px;
    position: sticky; top: 0; z-index: 10;
    margin-inline: -20px; padding: 14px 20px;
    background: var(--paper);
    transition: box-shadow .2s ease;
  }
  .sec-head.is-stuck { box-shadow: 0 1px 0 var(--rule), 0 8px 16px -8px rgba(0,0,0,.18); }
  .sec-head h2 { font-size: 24px; font-weight: 600; }
  .sec-head p { color: var(--muted); font-size: 13px; }

  /* ---------- 한눈에 보기: bento grid ---------- */
  .bento {
    display: grid; gap: 14px;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-template-areas:
      "proj proj hours records"
      "proj proj period period"
      "dist dist dist  evid";
  }
  .tile {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 14px;
    padding: 18px 20px; min-width: 0;
    display: flex; flex-direction: column; gap: 4px;
  }
  .tile .label { font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .tile .value { font-family: var(--display); font-size: 34px; font-weight: 600; line-height: 1.2; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile .value small { font-family: var(--body); font-size: 14px; font-weight: 500; color: var(--ink-2); margin-left: 3px; }
  .tile .sub { font-size: 12.5px; color: var(--ink-2); }
  .tile .foot { margin-top: auto; padding-top: 14px; }
  .t-proj { grid-area: proj; background: var(--accent-soft); border-color: transparent; }
  .t-proj .value { font-size: clamp(56px, 7vw, 84px); line-height: 1; margin-top: 8px; color: var(--accent); }
  .t-proj .value small { font-size: 18px; }
  .t-hours { grid-area: hours; }
  .t-records { grid-area: records; }
  .t-span { grid-area: period; }
  .t-dist { grid-area: dist; }
  .t-evid { grid-area: evid; }

  /* 팀/개인 비율 */
  .split { display: flex; gap: 2px; height: 10px; border-radius: 999px; overflow: hidden; }
  .split i { display: block; height: 100%; }
  .split-legend { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; color: var(--ink-2); }
  .split-legend b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .proj-recent { margin-top: 14px; padding-top: 12px; border-top: 1px solid color-mix(in srgb, var(--accent) 20%, transparent); font-size: 13px; color: var(--ink-2); }
  .proj-recent b { display: block; color: var(--ink); font-weight: 600; margin-top: 2px; }

  /* 활동 기간 타임라인: 프로젝트 한 건 = 한 줄 */
  .tl { display: grid; gap: 3px; }
  .tl span { display: block; height: 5px; border-radius: 3px; }
  .tl-axis { display: flex; justify-content: space-between; margin-top: 6px; font-family: var(--mono); font-size: 11px; color: var(--muted); }

  /* 증빙 링크 비율 */
  .meter { height: 6px; border-radius: 999px; background: var(--rule); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }

  .dist-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  .dist-top .t { font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .dist-top .s { font-size: 12px; color: var(--muted); }
  .bar { display: flex; gap: 2px; height: 14px; position: relative; }
  .bar .seg { height: 100%; border-radius: 0; cursor: pointer; border: 0; padding: 0; transition: opacity .15s; }
  .bar .seg:first-child { border-radius: 4px 0 0 4px; }
  .bar .seg:last-child { border-radius: 0 4px 4px 0; }
  .bar.has-hover .seg:not(:hover) { opacity: .45; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .legend b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .tip {
    position: fixed; pointer-events: none; z-index: 30; background: var(--ink); color: var(--paper);
    font-size: 12.5px; padding: 6px 9px; border-radius: 4px; white-space: nowrap; box-shadow: var(--shadow);
  }

  /* ---------- 대표 프로젝트 ---------- */
  .featured { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .feat {
    text-align: left; font: inherit; color: inherit; cursor: pointer;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 8px;
    padding: 20px; display: flex; flex-direction: column; gap: 12px;
    transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  .feat:hover { border-color: var(--rule-strong); box-shadow: var(--shadow); transform: translateY(-2px); }
  .feat .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .feat .call { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .feat h3 { font-size: 19px; font-weight: 600; line-height: 1.35; }
  .feat .sum { color: var(--ink-2); font-size: 14px; }
  .feat .kpi { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--rule); display: flex; align-items: baseline; gap: 10px; }
  .feat .kpi .v { font-family: var(--display); font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .feat .kpi .l { font-size: 13px; color: var(--ink-2); }
  .feat .more { font-size: 13px; color: var(--accent); font-weight: 500; }

  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

  /* ---------- 역량별 목록 ---------- */
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .filters button {
    font: inherit; font-size: 13px; cursor: pointer; padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--rule-strong); background: transparent; color: var(--ink-2);
    display: inline-flex; align-items: center; gap: 7px;
  }
  .filters button i { width: 8px; height: 8px; border-radius: 50%; }
  .filters button .n { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  .filters button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .filters button[aria-pressed="true"] .n { color: var(--paper); opacity: .7; }

  .comp-desc { font-size: 13.5px; color: var(--ink-2); margin-bottom: 12px; min-height: 1.6em; }
  .list { border-top: 1px solid var(--rule-strong); }
  .row {
    width: 100%; text-align: left; font: inherit; color: inherit; background: transparent; cursor: pointer;
    border: 0; border-bottom: 1px solid var(--rule);
    display: grid; grid-template-columns: 116px minmax(0, 1fr) 150px 120px 24px; gap: 16px; align-items: center;
    padding: 14px 8px;
  }
  .row:hover { background: var(--surface); }
  .row .call { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
  .row .title { font-weight: 600; font-size: 15px; }
  .row .title .star { font-size: 11px; font-weight: 500; color: var(--accent); background: var(--accent-soft); padding: 1px 6px; border-radius: 3px; margin-left: 6px; vertical-align: 2px; }
  .row .role { font-size: 13px; color: var(--ink-2); display: block; margin-top: 2px; }
  .row .period { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); }
  .row .arrow { color: var(--muted); font-size: 18px; }
  .row:hover .arrow { color: var(--accent); }

  /* ---------- 상세 다이얼로그 ---------- */
  dialog {
    border: 0; padding: 0; background: var(--surface); color: var(--ink);
    width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
    border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.35);
  }
  dialog::backdrop { background: rgba(14,18,26,.55); }
  .dlg { display: flex; flex-direction: column; max-height: calc(100vh - 48px); }
  .dlg-head { padding: 22px 24px 0; border-bottom: 1px solid var(--rule); }
  .dlg-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .dlg-meta .mono { font-size: 12.5px; color: var(--accent); }
  .close { font: inherit; font-size: 13px; background: transparent; border: 1px solid var(--rule-strong); color: var(--ink-2); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  .close:hover { color: var(--ink); border-color: var(--ink-2); }
  .dlg-head h3 { font-size: 24px; font-weight: 600; margin-top: 10px; line-height: 1.3; }
  .facts { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 10px; font-size: 13px; color: var(--ink-2); }
  .facts .k { color: var(--muted); margin-right: 5px; }
  .tabs { display: flex; gap: 2px; margin-top: 16px; overflow-x: auto; }
  .tabs button {
    font: inherit; font-size: 14px; font-weight: 500; background: transparent; border: 0; cursor: pointer;
    padding: 10px 14px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
  }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .tabs button .n { font-family: var(--mono); font-size: 11.5px; margin-left: 4px; color: var(--muted); }
  .dlg-body { padding: 22px 24px 26px; overflow-y: auto; }
  .panel h4 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 8px; letter-spacing: .02em; }
  .panel > * + h4 { margin-top: 22px; }
  .panel p { color: var(--ink-2); max-width: 64ch; }
  .role-title { font-family: var(--display); font-size: 18px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
  .bullets { margin: 0; padding-left: 18px; color: var(--ink-2); }
  .bullets li + li { margin-top: 4px; }
  .share { display: flex; gap: 2px; height: 10px; margin-top: 6px; max-width: 360px; }
  .share div { border-radius: 3px; }
  .share-cap { font-size: 12.5px; color: var(--muted); margin-top: 6px; }

  .steps { list-style: none; margin: 0; padding: 0; position: relative; }
  .steps li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding-bottom: 18px; position: relative; }
  .steps li:not(:last-child)::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 2px; width: 1px; background: var(--rule-strong); }
  .steps .num { width: 27px; height: 27px; border-radius: 50%; border: 1px solid var(--rule-strong); display: grid; place-items: center; font-family: var(--mono); font-size: 12px; color: var(--ink-2); background: var(--surface); }
  .steps .stage { font-weight: 600; }
  .steps .when { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: 8px; font-weight: 400; }
  .steps .detail { color: var(--ink-2); font-size: 14px; margin-top: 2px; }

  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .metric { border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; }
  .metric .v { font-family: var(--display); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.25; }
  .metric .l { font-size: 12.5px; color: var(--ink-2); }

  .evidence { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  .evidence li { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--rule); }
  .ev-kind { font-family: var(--mono); font-size: 11.5px; text-align: center; padding: 3px 0; border-radius: 3px; background: var(--accent-soft); color: var(--accent); }
  .ev-title { font-weight: 500; }
  .ev-note { font-size: 12.5px; color: var(--muted); }
  .ev-link { font-size: 13px; white-space: nowrap; }
  .ev-file { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }

  /* ---------- 자격·경험 ---------- */
  .cred-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 32px; align-items: start; }
  .col-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding-bottom: 10px; border-bottom: 2px solid var(--ink); }
  .col-head h3 { font-size: 18px; font-weight: 600; }
  .col-head span { font-size: 12.5px; color: var(--muted); }
  .items { border-top: 0; }
  details.item { border-bottom: 1px solid var(--rule); }
  details.item > summary {
    list-style: none; cursor: pointer; padding: 13px 4px;
    display: grid; grid-template-columns: minmax(0, 1fr) auto 16px; gap: 12px; align-items: center;
  }
  details.item > summary::-webkit-details-marker { display: none; }
  details.item > summary:hover { background: var(--surface); }
  details.item > summary .chev { color: var(--muted); transition: transform .15s; font-size: 14px; }
  details.item[open] > summary .chev { transform: rotate(90deg); }
  .it-name { font-weight: 600; }
  .it-sub { display: block; font-size: 12.5px; color: var(--ink-2); font-weight: 400; margin-top: 1px; }
  .it-date { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; text-align: right; }
  .status { display: inline-block; font-size: 11.5px; font-weight: 500; padding: 1px 7px; border-radius: 3px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
  .status.ok { background: var(--accent-soft); color: var(--accent); }
  .status.plan { border: 1px dashed var(--rule-strong); color: var(--ink-2); }
  .verify {
    margin: 0 4px 14px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px;
    display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 16px; font-size: 13.5px;
  }
  .verify dt { color: var(--muted); font-size: 12.5px; }
  .verify dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; }
  .verify .acts { margin: 0; padding-left: 18px; }
  .verify .num-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .verify .actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; padding-top: 6px; border-top: 1px solid var(--rule); margin-top: 4px; }
  .act { font: inherit; font-size: 12.5px; padding: 5px 10px; border-radius: 4px; border: 1px solid var(--rule-strong); background: transparent; color: var(--ink); cursor: pointer; text-decoration: none; }
  .act:hover { border-color: var(--accent); color: var(--accent); }
  .exp-filters { margin-top: 12px; margin-bottom: 4px; }
  .year { font-family: var(--mono); font-size: 12px; color: var(--muted); padding: 14px 4px 2px; }

  /* ---------- 왼쪽 사이드바 메뉴 (접기/펼치기) ---------- */
  :root { --sb-open: 232px; --sb-closed: 68px; }
  body { padding-left: calc(var(--sb-open) + 20px); }
  body.sb-ready { transition: padding-left .25s ease; }
  body.sb-collapsed { padding-left: calc(var(--sb-closed) + 20px); }
  .sidebar {
    position: fixed; inset: 0 auto 0 0; z-index: 20;
    width: var(--sb-open); overflow: hidden;
    display: flex; flex-direction: column; gap: 4px;
    padding: 14px 12px;
    background: var(--surface); border-right: 1px solid var(--rule);
    transition: none;
  }

/* 요약 카드 — classProjects · experiences · certifications에서 계산 */
(function renderStats() {
  const CPs = PORTFOLIO.classProjects || [], EXs = PORTFOLIO.experiences || [], CTs = PORTFOLIO.certifications || [];
  const kindOf = (c) => (c.course ? "course" : "intern");
  const KIND = { course: { label: "수업 프로젝트", color: "var(--c1)", go: "project" },
                 intern: { label: "실무실습", color: "var(--c2)", go: "project" },
                 award:  { label: "수상", color: "var(--c4)", go: "credentials" } };
  const nCourse = CPs.filter((c) => kindOf(c) === "course").length, nIntern = CPs.length - nCourse;
  const awards = EXs.filter((e) => e.type === "award");
  const days = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5) + 1;
  const interns = CPs.filter((c) => kindOf(c) === "intern");
  const internDays = interns.reduce((t, c) => t + days(c.start, c.end), 0);
  const certs = CTs.filter((c) => c.status === "취득");
  const recent = CPs.reduce((a, c) => (!a || ym(c.end) > ym(a.end) ? c : a), null);
  // 타임라인: 프로젝트 + 수상
  const items = CPs.map((c) => ({ k: kindOf(c), title: c.title, start: c.start, end: c.end }))
    .concat(awards.map((e) => ({ k: "award", title: e.title, start: e.start, end: e.end })));
  if (!items.length) return;
  const first = Math.min(...items.map((i) => ym(i.start))), last = Math.max(...items.map((i) => ym(i.end)));
  const span = last - first + 1;
  const toYM = (n) => `${Math.floor(n / 12)}.${String((n % 12) + 1).padStart(2, "0")}`;
  const val = (v, u) => `<div class="value">${v}<small>${u}</small></div>`;
  const tl = items.slice().sort((a, b) => ym(a.start) - ym(b.start)).map((i) => {
    const l = ((ym(i.start) - first) / span) * 100, w = ((ym(i.end) - ym(i.start) + 1) / span) * 100;
    return `<span style="margin-left:${l}%;width:${w}%;background:${KIND[i.k].color}" title="${esc(i.title)}"></span>`;
  }).join("");

  $("stats").innerHTML = `
    <div class="tile t-proj">
      <div class="label">수행 프로젝트</div>
      ${val(fmt(CPs.length), "건")}
      <div class="foot">
        <div class="split" role="img" aria-label="수업 ${nCourse}건, 실무실습 ${nIntern}건">
          <i style="flex:${nCourse};background:var(--accent)"></i><i style="flex:${nIntern};background:color-mix(in srgb, var(--accent) 40%, transparent)"></i>
        </div>
        <div class="split-legend"><span>수업 <b>${nCourse}</b></span><span>실무실습 <b>${nIntern}</b></span></div>
        ${recent ? `<div class="proj-recent">가장 최근 프로젝트<b>${esc(recent.title)}</b></div>` : ""}
      </div>
    </div>
    <div class="tile t-hours">
      <div class="label">실무실습 기간</div>
      ${val(fmt(internDays), "일")}
      <div class="sub">기관 ${interns.length}곳 · 달력 기준</div>
    </div>
    <div class="tile t-records">
      <div class="label">보유 자격증</div>
      ${val(fmt(certs.length), "개")}
      <div class="sub">${certs.map((c) => esc(c.name)).join(" · ")}</div>
    </div>
    <div class="tile t-span">
      <div class="label">활동 기간</div>
      ${val(fmt(span), "개월")}
      <div class="foot">
        <div class="tl" role="img" aria-label="${toYM(first)}부터 ${toYM(last)}까지 활동 ${items.length}건의 기간">${tl}</div>
        <div class="tl-axis"><span>${toYM(first)}</span><span>${toYM(last)}</span></div>
      </div>
    </div>
    <div class="tile t-dist">
      <div class="dist-top">
        <span class="t">활동 구성</span>
        <span class="s">막대를 누르면 해당 메뉴로 이동</span>
      </div>
      <div class="bar" id="distBar" role="group" aria-label="유형별 활동 수"></div>
      <div class="legend" id="distLegend"></div>
    </div>
    <div class="tile t-evid">
      <div class="label">수상</div>
      ${val(fmt(awards.length), "건")}
      <div class="sub">${awards.map((e) => esc(e.title)).join(", ")}</div>
    </div>`;

  // 유형별 막대
  const total = items.length;
  const counts = Object.keys(KIND).map((k) => ({ k, n: items.filter((i) => i.k === k).length })).filter((d) => d.n > 0);
  const bar = $("distBar"), tip = $("tip");
  bar.innerHTML = counts.map((d) => `<button class="seg" type="button" data-k="${d.k}" style="flex:${d.n};background:${KIND[d.k].color}" aria-label="${KIND[d.k].label} ${d.n}건"></button>`).join("");
  $("distLegend").innerHTML = counts.map((d) => `<span><i style="background:${KIND[d.k].color}"></i>${KIND[d.k].label} <b>${d.n}</b></span>`).join("");
  bar.querySelectorAll(".seg").forEach((seg) => {
    const k = seg.dataset.k, n = counts.find((d) => d.k === k).n;
    seg.addEventListener("mouseenter", () => { bar.classList.add("has-hover"); tip.textContent = `${KIND[k].label} · ${n}건 (${Math.round((n / total) * 100)}%)`; tip.hidden = false; });
    seg.addEventListener("mousemove", (e) => { tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = e.clientY - 36 + "px"; });
    seg.addEventListener("mouseleave", () => { bar.classList.remove("has-hover"); tip.hidden = true; });
    seg.addEventListener("click", () => { const go = KIND[k].go; if (currentView) location.hash = go; else $(go).scrollIntoView({ behavior: "smooth", block: "start" }); });
  });
})();

/* 대표 프로젝트 */
const chip = (k) => `<span class="chip"><i style="background:${col(k)}"></i>${C[k].label}</span>`;
$("featured").innerHTML = P.filter((p) => p.featured).slice(0, 3).map((p) => `

/* 역량별 목록 */
let current = "all";
function renderFilters() {
  const items = [{ k: "all", label: "전체", n: P.length }].concat(
    Object.keys(C).map((k) => ({ k, label: C[k].label, n: P.filter((p) => p.competency === k).length })));
  $("filters").innerHTML = items.map((it) => `
    <button type="button" data-k="${it.k}" aria-pressed="${it.k === current}">
      ${it.k !== "all" ? `<i style="background:${col(it.k)}"></i>` : ""}${it.label}<span class="n">${it.n}</span></button>`).join("");
  $("filters").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => setFilter(b.dataset.k)));
}
function renderList() {
  const rows = P.filter((p) => current === "all" || p.competency === current)
    .sort((a, b) => ym(b.end) - ym(a.end));
  $("compDesc").textContent = current === "all" ? "다섯 가지 역량에 걸친 전체 프로젝트입니다. 최근 순으로 정렬했습니다." : C[current].desc;
  $("listCount").textContent = `${rows.length}건 · 행을 누르면 상세 보기`;
  $("list").innerHTML = rows.map((p) => `
    <button class="row" type="button" data-id="${p.id}">
      <span class="call">${esc(p.callNo)}</span>
      <span class="main"><span class="title">${esc(p.title)}${p.featured ? '<span class="star">대표</span>' : ""}</span>
        <span class="role">${esc(p.role.title)}</span></span>
      <span class="comp">${chip(p.competency)}</span>
      <span class="period">${dot(p.start)}–${dot(p.end)}</span>
      <span class="arrow" aria-hidden="true">›</span>
    </button>`).join("");
}
function setFilter(k) {
  current = k; renderFilters(); renderList();
  try { localStorage.setItem("pf-filter", k); } catch (e) {}
}
try { const saved = localStorage.getItem("pf-filter"); if (saved && (saved === "all" || C[saved])) current = saved; } catch (e) {}
renderFilters(); renderList();

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-id]");

});

/* 상세 다이얼로그 */
const dlg = $("dlg");
let active = null, activeTab = "role";
const TABS = [["role", "역할"], ["process", "과정"], ["results", "결과"], ["evidence", "증빙"]];

function openProject(id) {
  const p = P.find((x) => x.id === id);
  if (!p) return;
  active = p; activeTab = "role";
  $("dCall").textContent = `청구기호 ${p.callNo}`;
  $("dTitle").textContent = p.title;
  $("dFacts").innerHTML = `
    <span>${chip(p.competency)}</span>
    <span><span class="k">기간</span>${dot(p.start)}–${dot(p.end)} (${months(p)}개월)</span>
    <span><span class="k">형태</span>${p.team === 1 ? "개인" : `팀 ${p.team}명`}</span>
    <span><span class="k">투입</span>${fmt(p.hours)}시간</span>
    ${p.records ? `<span><span class="k">레코드</span>${fmt(p.records)}건</span>` : ""}`;
  renderTabs(); renderPanel();
  if (!dlg.open) dlg.showModal();
  try { history.replaceState(null, "", "#" + p.id); } catch (e) {}
}
function renderTabs() {
  const n = { process: active.process.length, evidence: active.evidence.length };
  $("dTabs").innerHTML = TABS.map(([k, l]) => `
    <button role="tab" type="button" id="tab-${k}" data-tab="${k}" aria-selected="${k === activeTab}" tabindex="${k === activeTab ? 0 : -1}">${l}${n[k] ? `<span class="n">${n[k]}</span>` : ""}</button>`).join("");
  $("dTabs").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { activeTab = b.dataset.tab; renderTabs(); renderPanel(); $("tab-" + activeTab).focus(); }));
  $("dBody").setAttribute("aria-labelledby", "tab-" + activeTab);
}
$("dTabs").addEventListener("keydown", (e) => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const i = TABS.findIndex(([k]) => k === activeTab);
  activeTab = TABS[(i + (e.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length][0];
  renderTabs(); renderPanel(); $("tab-" + activeTab).focus();
});
function renderPanel() {
  const p = active, body = $("dBody");
  let h = "";
  if (activeTab === "role") {
    const share = p.role.share;
    h = `<div class="panel">
      <div class="role-title">${esc(p.role.title)}</div>
      <p>${esc(p.role.desc)}</p>
      <h4>담당한 일</h4>
      <ul class="bullets">${p.role.items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>
      <h4>기여도</h4>
      <div class="share" role="img" aria-label="기여도 ${share}%">
        <div style="flex:${share};background:${col(p.competency)}"></div>
        ${share < 100 ? `<div style="flex:${100 - share};background:var(--rule)"></div>` : ""}
      </div>
      <div class="share-cap">${p.team === 1 ? "단독 수행 100%" : `팀 ${p.team}명 중 본인 기여 약 ${share}% (팀원 상호평가 기준)`}</div>
    </div>`;
  } else if (activeTab === "process") {
    h = `<div class="panel"><ol class="steps">${p.process.map((s, i) => `
      <li><span class="num">${i + 1}</span><div>
        <div class="stage">${esc(s.stage)}<span class="when">${esc(s.when)}</span></div>
        <div class="detail">${esc(s.detail)}</div></div></li>`).join("")}</ol></div>`;
  } else if (activeTab === "results") {
    h = `<div class="panel">
      <div class="metrics">${p.results.metrics.map((m) => `<div class="metric"><div class="v">${esc(m.value)}</div><div class="l">${esc(m.label)}</div></div>`).join("")}</div>
      <h4>성과</h4><p>${esc(p.results.summary)}</p>
      <h4>배운 점</h4><p>${esc(p.results.lesson)}</p></div>`;
  } else {
    h = `<div class="panel"><ul class="evidence">${p.evidence.map((e) => `
      <li><span class="ev-kind">${esc(e.kind)}</span>
        <div><div class="ev-title">${esc(e.title)}</div><div class="ev-note">${esc(e.note || "")}</div></div>
        ${e.url ? `<a class="ev-link" href="${esc(e.url)}" target="_blank" rel="noopener">열기 ↗</a>` : `<span class="ev-file">${esc(e.file || "")}</span>`}
      </li>`).join("")}</ul></div>`;
  }
  body.innerHTML = h;
  body.scrollTop = 0;
}

dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });

const EXPS = PORTFOLIO.experiences || [];
const ET = PORTFOLIO.expTypes || {};

let expType = "all";
function renderExp() {
  const types = Object.keys(ET).filter((k) => EXPS.some((e) => e.type === k));
  $("expFilters").innerHTML = [["all", "전체", EXPS.length]].concat(types.map((k) => [k, ET[k], EXPS.filter((e) => e.type === k).length]))
    .map(([k, l, n]) => `<button type="button" data-et="${k}" aria-pressed="${k === expType}">${l}<span class="n">${n}</span></button>`).join("");
  $("expFilters").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { expType = b.dataset.et; renderExp(); }));
  const rows = EXPS.filter((e) => expType === "all" || e.type === expType).sort((a, b) => ym(b.end) - ym(a.end));
  let lastYear = null, h = "";
  rows.forEach((e) => {
    const y = e.end.slice(0, 4);
    if (y !== lastYear) { h += `<div class="year">${y}</div>`; lastYear = y; }
    const period = e.start === e.end ? dot(e.start) : `${dot(e.start)}–${dot(e.end)}`;
    h += `
    <details class="item">
      <summary>
        <span class="it-name">${esc(e.title)}<span class="it-sub">${esc(ET[e.type] || "")} · ${esc(e.org)}</span></span>
        <span class="it-date">${period}</span><span class="chev" aria-hidden="true">›</span>
      </summary>
      <dl class="verify">
        ${e.desc ? `<dt>내용</dt><dd>${esc(e.desc)}</dd>` : ""}
        ${e.phases ? e.phases.map((ph) => `<dt>${esc(ph.label)}</dt><dd>${ph.start === ph.end ? dot(ph.start) : `${dot(ph.start)}–${dot(ph.end)}`}</dd>`).join("") : `<dt>기간</dt><dd>${period}${e.hours ? ` · ${fmt(e.hours)}시간` : ""}</dd>`}
        ${e.proof ? `<dt>증빙</dt><dd>${esc(e.proof)}${e.file ? ` <span class="mono" style="font-size:12px;color:var(--muted)">(${esc(e.file)})</span>` : ""}</dd>` : ""}
        ${e.contact ? `<dt>확인처</dt><dd>${esc(e.contact)}</dd>` : ""}
        ${(e.verifyUrl || e.project) ? `<div class="actions">${linkAct(e.verifyUrl, "실적 조회 사이트")}${projAct(e.project)}</div>` : ""}
      </dl>
    </details>`;
  });
  $("expList").innerHTML = h;
}

/* 메뉴 하나만 보기: #about, #summary … 해시면 그 섹션만 표시, #all이면 전체 */
function applyView() {
  const id = location.hash.slice(1);
  if (/^p\d+$/.test(id)) return;            // 프로젝트 다이얼로그용 해시는 보기 상태를 바꾸지 않음
  const target = id && id !== "all" ? document.querySelector(`[data-view-id]#${CSS.escape(id)}`) : null;
  currentView = target ? id : null;
  if (currentView) document.body.dataset.view = currentView;
  else delete document.body.dataset.view;
  document.querySelectorAll("[data-view-id]").forEach((el) => el.classList.toggle("is-active", el === target));
  document.querySelectorAll(".sidebar nav a").forEach((a) => {
    const on = a.getAttribute("href") === "#" + (currentView || "all");
    if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  scrollTo(0, 0);
}
addEventListener("hashchange", applyView);

/* 고정된 섹션 제목에 그림자: 스크롤을 시작했고 제목이 맨 위에 붙어 있을 때 */
function updateStuck() {
  const scrolled = scrollY > 0;
  document.querySelectorAll(".sec-head").forEach((h) => {
    h.classList.toggle("is-stuck", scrolled && h.getBoundingClientRect().top <= 0.5 && h.parentElement.getBoundingClientRect().top < 0);
  });
}
addEventListener("scroll", updateStuck, { passive: true });
addEventListener("resize", updateStuck);
addEventListener("hashchange", () => requestAnimationFrame(updateStuck));
updateStuck();

/* 사이드바 접기/펼치기 — 넓은 화면은 상태를 기억, 좁은 화면은 접힌 채로 시작 */
const sbToggle = $("sbToggle"), sbTip = $("sbTip");
const narrow = matchMedia("(max-width: 860px)");
function setSidebar(collapsed, save) {
  document.body.classList.toggle("sb-collapsed", collapsed);
  sbToggle.setAttribute("aria-expanded", String(!collapsed));
  sbToggle.setAttribute("aria-label", collapsed ? "메뉴 펼치기" : "메뉴 접기");
  if (save && !narrow.matches) { try { localStorage.setItem("pf-sidebar", collapsed ? "1" : "0"); } catch (e) {} }
}
let sbSaved = null;
try { sbSaved = localStorage.getItem("pf-sidebar"); } catch (e) {}
setSidebar(narrow.matches || sbSaved === "1", false);
requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add("sb-ready")));
sbToggle.addEventListener("click", () => setSidebar(!document.body.classList.contains("sb-collapsed"), true));
$("sbScrim").addEventListener("click", () => setSidebar(true, false));
narrow.addEventListener("change", (e) => setSidebar(e.matches || sbSaved === "1", false));
// 좁은 화면에서 메뉴를 고르면 다시 접기
document.querySelectorAll(".sidebar .sb-link").forEach((a) => a.addEventListener("click", () => { if (narrow.matches) setSidebar(true, false); }));
// 접힌 상태에서 아이콘에 올리면 메뉴 이름 표시
document.querySelectorAll(".sidebar .sb-link").forEach((a) => {
  const show = () => {
    if (!document.body.classList.contains("sb-collapsed")) return;
    const r = a.getBoundingClientRect();
    sbTip.textContent = a.dataset.label; sbTip.hidden = false;
    sbTip.style.left = r.right + 10 + "px"; sbTip.style.top = r.top + r.height / 2 - sbTip.offsetHeight / 2 + "px";
  };
  const hide = () => { sbTip.hidden = true; };
  a.addEventListener("mouseenter", show); a.addEventListener("focus", show);
  a.addEventListener("mouseleave", hide); a.addEventListener("blur", hide);
});
applyView();

if (P.length) $("foot").textContent = `요약 수치는 프로젝트 ${P.length}건의 기록(투입 시간·레코드 수·기간·증빙)을 페이지가 열릴 때 직접 합산한 값입니다. 마지막 갱신 2026.11.`;
</script>
